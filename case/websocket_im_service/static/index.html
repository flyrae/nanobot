<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Nanobot IM</title>
    <!-- markdown & code highlight (local, offline-ready) -->
    <script src="/static/marked.min.js"></script>
    <link rel="stylesheet" href="/static/github.min.css" />
    <script src="/static/highlight.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        background: #f0f2f5;
        color: #1d1d1f;
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ── layout ── */
      .app {
        max-width: 480px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        box-shadow: 0 0 40px rgba(0,0,0,.06);
      }

      /* ── header ── */
      .header {
        padding: 16px 20px 12px;
        background: #ffffff;
        border-bottom: 1px solid #e8e8ed;
        flex-shrink: 0;
      }
      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .header-top h1 {
        font-size: 18px;
        font-weight: 700;
        color: #1d1d1f;
        letter-spacing: -.2px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #86868b;
        background: #f5f5f7;
        padding: 4px 10px;
        border-radius: 20px;
      }
      .status-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #86868b;
        transition: background .3s;
      }
      .status-badge.connected .status-dot { background: #34c759; }
      .status-badge.connected { color: #34c759; }

      /* ── config row ── */
      .config-row {
        display: flex;
        gap: 8px;
      }
      .config-row .field { flex: 1; min-width: 0; }
      .config-row .field.wide { flex: 2; }
      .config-row label {
        font-size: 11px;
        font-weight: 500;
        color: #86868b;
        text-transform: uppercase;
        letter-spacing: .3px;
        display: block;
        margin-bottom: 4px;
      }
      .config-row input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #e8e8ed;
        background: #f5f5f7;
        color: #1d1d1f;
        font-size: 13px;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
      }
      .config-row input:focus {
        border-color: #007aff;
        box-shadow: 0 0 0 3px rgba(0,122,255,.12);
      }

      /* ── messages area ── */
      .messages-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 8px;
        background: #f0f2f5;
        -webkit-overflow-scrolling: touch;
      }
      .messages {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ── single message ── */
      .message {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.45;
        word-break: break-word;
        position: relative;
        animation: msgIn .25s ease;
      }
      @keyframes msgIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .message.user {
        align-self: flex-end;
        background: #007aff;
        color: #ffffff;
        border-bottom-right-radius: 6px;
      }
      .message.bot {
        align-self: flex-start;
        background: #ffffff;
        color: #1d1d1f;
        border-bottom-left-radius: 6px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
      }
      .message .meta {
        font-size: 11px;
        margin-bottom: 3px;
        opacity: .65;
      }
      .message.user .meta { color: rgba(255,255,255,.75); }
      .message.bot .meta  { color: #86868b; }

      .message img {
        max-width: 100%;
        border-radius: 12px;
        margin-top: 6px;
        display: block;
      }

      /* ── markdown prose ── */
      .message .md-body { line-height: 1.6; }
      .message .md-body p { margin: 0 0 8px; }
      .message .md-body p:last-child { margin-bottom: 0; }
      .message .md-body h1,
      .message .md-body h2,
      .message .md-body h3,
      .message .md-body h4 {
        margin: 12px 0 6px;
        font-weight: 600;
        line-height: 1.3;
      }
      .message .md-body h1 { font-size: 1.25em; }
      .message .md-body h2 { font-size: 1.15em; }
      .message .md-body h3 { font-size: 1.05em; }
      .message .md-body ul,
      .message .md-body ol {
        margin: 6px 0;
        padding-left: 1.4em;
      }
      .message .md-body li { margin: 2px 0; }
      .message .md-body blockquote {
        margin: 8px 0;
        padding: 4px 12px;
        border-left: 3px solid #c7c7cc;
        color: #6e6e73;
        background: rgba(0,0,0,.03);
        border-radius: 4px;
      }
      .message .md-body code {
        font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
        font-size: .88em;
        background: rgba(0,0,0,.06);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .message .md-body pre {
        margin: 8px 0;
        padding: 12px;
        border-radius: 10px;
        background: #1d1d1f;
        color: #e8e8ed;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        font-size: 13px;
        line-height: 1.5;
      }
      .message .md-body pre code {
        background: none;
        padding: 0;
        color: inherit;
        font-size: inherit;
      }
      .message .md-body table {
        border-collapse: collapse;
        margin: 8px 0;
        font-size: 13px;
        width: 100%;
      }
      .message .md-body th,
      .message .md-body td {
        border: 1px solid #e8e8ed;
        padding: 6px 10px;
        text-align: left;
      }
      .message .md-body th {
        background: #f5f5f7;
        font-weight: 600;
      }
      .message .md-body a {
        color: #007aff;
        text-decoration: none;
      }
      .message .md-body a:hover { text-decoration: underline; }
      .message .md-body hr {
        border: none;
        border-top: 1px solid #e8e8ed;
        margin: 10px 0;
      }

      /* user bubble: adjust inline code colors */
      .message.user .md-body code {
        background: rgba(255,255,255,.18);
        color: #fff;
      }

      /* ── composer ── */
      .composer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: #ffffff;
        border-top: 1px solid #e8e8ed;
        flex-shrink: 0;
      }
      .composer input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 20px;
        border: 1px solid #e8e8ed;
        background: #f5f5f7;
        font-size: 15px;
        color: #1d1d1f;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
      }
      .composer input:focus {
        border-color: #007aff;
        box-shadow: 0 0 0 3px rgba(0,122,255,.12);
      }
      .composer button {
        width: 40px; height: 40px;
        border-radius: 50%;
        border: none;
        background: #007aff;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background .2s, transform .1s;
      }
      .composer button:active { transform: scale(.92); }
      .composer button:hover  { background: #0062d6; }
      .composer button svg { width: 20px; height: 20px; fill: #fff; }

      /* ── scrollbar ── */
      .messages-wrap::-webkit-scrollbar { width: 4px; }
      .messages-wrap::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 4px; }
      .messages-wrap::-webkit-scrollbar-track { background: transparent; }

      /* ── safe-area for notched phones ── */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .composer { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
      }

      /* ── responsive: wider screens ── */
      @media (min-width: 481px) {
        body { background: #e5e5ea; }
        .app { border-radius: 0; height: 100vh; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- header -->
      <div class="header">
        <div class="header-top">
          <h1>💬 Nanobot IM</h1>
          <span class="status-badge" id="statusBadge">
            <span class="status-dot"></span>
            <span id="status">未连接</span>
          </span>
        </div>
        <div class="config-row">
          <div class="field">
            <label>昵称</label>
            <input id="name" value="user" />
          </div>
          <div class="field">
            <label>房间</label>
            <input id="room" value="lobby" />
          </div>
          <div class="field wide">
            <label>服务地址</label>
            <input id="endpoint" value="ws://localhost:19090/ws" />
          </div>
        </div>
      </div>

      <!-- messages -->
      <div class="messages-wrap">
        <div class="messages" id="messages"></div>
      </div>

      <!-- composer -->
      <div class="composer">
        <input id="content" placeholder="输入消息…" />
        <button id="send" aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <script>
      const statusEl    = document.getElementById("status");
      const badgeEl     = document.getElementById("statusBadge");
      const messagesEl  = document.getElementById("messages");
      const messagesWrap= document.querySelector(".messages-wrap");
      const nameEl      = document.getElementById("name");
      const roomEl      = document.getElementById("room");
      const endpointEl  = document.getElementById("endpoint");
      const contentEl   = document.getElementById("content");
      const sendBtn     = document.getElementById("send");

      let ws;

      // ── configure marked ──
      marked.setOptions({
        breaks: true,
        gfm: true,
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        }
      });

      function renderMarkdown(text) {
        try { return marked.parse(text); }
        catch { return text; }
      }

      function setStatus(text, connected) {
        statusEl.textContent = text;
        badgeEl.classList.toggle("connected", !!connected);
      }

      function fmtTime(ts) {
        if (!ts) return "";
        try {
          const d = new Date(ts);
          return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
        } catch { return ts; }
      }

      function appendMessage(payload) {
        const role = payload.role === "bot" ? "bot" : "user";
        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${payload.name}  ${fmtTime(payload.timestamp)}`;

        const body = document.createElement("div");
        if (role === "bot") {
          body.className = "md-body";
          if (payload.content) {
            body.innerHTML = renderMarkdown(payload.content);
          }
        } else {
          body.textContent = payload.content;
        }

        // Only add meta + body when there is text content, or no media
        const hasMedia = Array.isArray(payload.media_base64) && payload.media_base64.some(
          (item) => typeof item === "string" && item.startsWith("data:image")
        );
        if (payload.content) {
          wrapper.append(meta, body);
        } else if (!hasMedia) {
          wrapper.append(meta, body);
        }
        // If content is empty but has media, skip text bubble — show images only

        if (hasMedia) {
          payload.media_base64.forEach((item) => {
            if (typeof item === "string" && item.startsWith("data:image")) {
              const img = document.createElement("img");
              img.src = item;
              wrapper.appendChild(img);
            }
          });
        }

        messagesEl.appendChild(wrapper);
        messagesWrap.scrollTop = messagesWrap.scrollHeight;
      }

      function connect() {
        if (ws) ws.close();
        ws = new WebSocket(endpointEl.value);
        setStatus("连接中…", false);

        ws.onopen = () => setStatus("已连接", true);

        ws.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload.type === "chat") appendMessage(payload);
          } catch {}
        };

        ws.onclose = () => setStatus("未连接", false);
        ws.onerror = () => setStatus("连接失败", false);
      }

      function sendMessage() {
        const text = contentEl.value.trim();
        if (!text) return;

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          connect();
          setTimeout(sendMessage, 400);
          return;
        }

        const payload = {
          type: "chat",
          name: nameEl.value,
          room: roomEl.value,
          role: "user",
          content: text,
        };
        ws.send(JSON.stringify(payload));
        contentEl.value = "";
      }

      sendBtn.addEventListener("click", sendMessage);
      contentEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      connect();
    </script>
  </body>
</html>
